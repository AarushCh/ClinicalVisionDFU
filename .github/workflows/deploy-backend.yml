name: Deploy Backend to Hugging Face

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Without pipefail a failing git in a pipe is masked by tee's success.
          set -o pipefail

          # An unset secret otherwise reaches git as an empty password and comes
          # back as an opaque 403, indistinguishable from a revoked one.
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Ask Hugging Face directly, so an expired token reports itself here
          # rather than as that same 403 from git.
          code=$(curl -sS -o /tmp/who.json -w '%{http_code}' -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2)
          if [ "$code" != "200" ]; then
            echo "::error::Hugging Face rejected HF_TOKEN (HTTP $code). Issue a new token with the Write role."
            exit 1
          fi
          # A notice, not a log line: the run summary is where this gets read.
          echo "::notice::Authenticated as $(jq -r '.name' /tmp/who.json), token role: $(jq -r '.auth.accessToken.role // "unknown"' /tmp/who.json)"

          cd backend/
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # backend/ is the Space repo root and GitHub is the source of truth,
          # so the tree is rebuilt and force-pushed rather than merged.
          git init -b main
          git remote add space "https://AUC6:$HF_TOKEN@huggingface.co/spaces/AUC6/ClinicalVision-API"
          git lfs install
          git lfs track "*.pt"
          git add .gitattributes .
          git commit -m "Automated sync from GitHub Actions" || echo "No changes to commit"

          # The hook explains itself over many coloured lines, so strip the
          # escapes and keep the whole tail: the last four were the closing rule.
          say() {
            sed 's/\x1b\[[0-9;]*m//g' "$1" | grep -v '^[[:space:]]*$' | tail -30 | tr '\n' '|'
          }
          if ! git lfs push --all space main 2>&1 | tee /tmp/lfs.log; then
            echo "::error::LFS upload refused: $(say /tmp/lfs.log)"
            exit 1
          fi
          if ! git push -f space HEAD:main 2>&1 | tee /tmp/push.log; then
            echo "::error::Push refused: $(say /tmp/push.log)"
            exit 1
          fi
