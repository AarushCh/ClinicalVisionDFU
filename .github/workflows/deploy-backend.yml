name: Deploy Backend to Hugging Face

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # An unset secret otherwise reaches git as an empty password and comes
          # back as an opaque 403, indistinguishable from a revoked one.
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Ask Hugging Face directly, so an expired or read-only token reports
          # itself here rather than as that same 403 from git.
          code=$(curl -sS -o /tmp/who.json -w '%{http_code}' -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2)
          if [ "$code" != "200" ]; then
            echo "::error::Hugging Face rejected HF_TOKEN (HTTP $code). Issue a new token with the Write role."
            exit 1
          fi
          echo "Authenticated as $(jq -r '.name' /tmp/who.json), token role: $(jq -r '.auth.accessToken.role // "unknown"' /tmp/who.json)"

          cd backend/
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # backend/ is the Space repo root and GitHub is the source of truth,
          # so the tree is rebuilt and force-pushed rather than merged.
          git init -b main
          git remote add space "https://AUC6:$HF_TOKEN@huggingface.co/spaces/AUC6/ClinicalVision-API"
          git lfs install
          git lfs track "*.pt"
          git add .gitattributes .
          git commit -m "Automated sync from GitHub Actions" || echo "No changes to commit"
          git lfs push --all space main
          git push -f space HEAD:main
